#
# action.yml — Validate DEED Manifests GitHub Action
# Scans the repository for .deed (DEED grammar) and legacy .a2ml manifests and
# validates structure, required fields, SPDX headers, and attestation blocks.
# a2ml is retired (owner ruling R-H3, standards #836/#837): DEED is the grammar.

name: 'Validate DEED Manifests'
description: >-
  Scan and validate .deed (DEED grammar) and legacy .a2ml manifest files in
  your repository. Checks for required fields (:schema-version, agent-id /
  pedigree name / :canonical-name, version), SPDX headers, and attestation
  block structure.
author: 'Jonathan D.A. Jewell'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: >-
      Directory path to scan for .a2ml and .deed files.
      Defaults to the repository root.
    required: false
    default: '.'
  strict:
    description: >-
      When true, warnings are promoted to errors and the action
      will fail on any validation issue. Defaults to false.
    required: false
    default: 'false'
  paths-ignore:
    description: >-
      Newline-separated path fragments to skip. Each line is matched as a
      substring against the file's path. Defaults to common vendored /
      training-corpus / fixture patterns so consumers don't have to repeat
      this carve-out in every repo. Pass an empty string to disable.
      Pattern follows hyperpolymath/hypatia#243 — validators that scan
      content patterns must distinguish a target file from a fixture /
      vendored / training-corpus file that legitimately contains the
      pattern being checked.
    required: false
    default: |
      vendor/
      vendored/
      verified-container-spec/
      .audittraining/
      integration/fixtures/
      test/fixtures/
      tests/fixtures/

outputs:
  files-scanned:
    description: 'Number of .deed/.a2ml manifest files scanned'
    value: ${{ steps.validate.outputs.files_scanned }}
  errors:
    description: 'Number of validation errors found'
    value: ${{ steps.validate.outputs.errors }}
  warnings:
    description: 'Number of validation warnings found'
    value: ${{ steps.validate.outputs.warnings }}

runs:
  using: 'composite'
  steps:
    - name: Validate A2ML manifests
      id: validate
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_PATHS_IGNORE: ${{ inputs.paths-ignore }}
      run: |
        "${GITHUB_ACTION_PATH}/validate-deed.sh"
